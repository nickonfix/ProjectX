{% extends "core/base.html" %}
{% load static %}
{% block title %}Home{% endblock title %}
{% block hero %}

<!-- Hero Section -->
<section class="bg-gradient-to-b from-orange-100 via-orange-500 to-white w-full min-h-screen flex items-center justify-center">
    <div class="w-full px-6 py-16 flex flex-col lg:flex-row items-center justify-between gap-8 max-w-7xl mx-auto">
        <div class="lg:w-1/2 w-full">
            <h1 class="text-4xl lg:text-5xl font-bold text-gray-800">Enjoy Delicious</h1> 
            <h1 class="text-5xl lg:text-6xl font-bold text-orange-600 pt-3 pb-6">Traditional Food</h1>
            <p class="text-lg text-gray-700 leading-relaxed mb-8">Good food warms the heart and mends the soul.</p>
            <a href="#" class="inline-block bg-orange-600 text-white px-8 py-4 rounded-full shadow-lg hover:bg-orange-700 transition duration-300 font-semibold text-lg">Order Now</a>
        </div>
        <div class="lg:w-1/2 w-full flex justify-center items-center">
            <img 
                src="{% static 'core/images/p1.png' %}" 
                alt="sushi platter"
                class="w-full max-w-md lg:max-w-full h-auto object-contain"
            >
        </div>
    </div>
</section>

{% endblock hero %}
{% block maincontent %}
{% endblock maincontent %}
